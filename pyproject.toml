[project]
name = "dictator"
version = "1.0.0"
description = "Local, privacy-first voice assistant for Linux with global dictation and smart agent control"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "faster-whisper>=1.0.0",
    "pynput>=1.7.6",
    "webrtcvad>=2.0.10",
    "onnxruntime>=1.16.0",
    "pulsectl>=23.5.0",
    "psutil>=5.9.0",
    "scikit-learn>=1.0",
    "requests>=2.0",
]

[project.scripts]
dictator = "dictator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
